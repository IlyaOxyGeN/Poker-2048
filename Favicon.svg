<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="felt" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f7a3c"/>
      <stop offset="100%" stop-color="#0b3d1e"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон сукна -->
  <rect width="100" height="100" rx="20" fill="url(#felt)"/>
  <rect x="3" y="3" width="94" height="94" rx="17"
        fill="none" stroke="#d4af37" stroke-width="2.5"/>

  <g filter="url(#shadow)">

    <!-- Левая карта: 6♣ — крупная, веером влево -->
    <g transform="translate(40, 52) rotate(-20)">
      <rect x="-22" y="-35" width="44" height="70" rx="4"
            fill="#fbfbf5" stroke="#1a1a1a" stroke-width="0.8"/>
      <text x="-17" y="-20" font-family="Georgia, serif"
            font-size="15" font-weight="bold" fill="#111">6</text>
      <text x="-17" y="-5" font-family="Georgia, serif"
            font-size="15" fill="#111">♣</text>
      <text x="0" y="12" font-family="Georgia, serif"
            font-size="30" text-anchor="middle" fill="#111">♣</text>
    </g>

    <!-- Правая карта: 3♣ — крупная, веером вправо, поверх -->
    <g transform="translate(60, 52) rotate(20)">
      <rect x="-22" y="-35" width="44" height="70" rx="4"
            fill="#ffffff" stroke="#1a1a1a" stroke-width="0.8"/>
      <text x="-17" y="-20" font-family="Georgia, serif"
            font-size="15" font-weight="bold" fill="#111">3</text>
      <text x="-17" y="-5" font-family="Georgia, serif"
            font-size="15" fill="#111">♣</text>
      <text x="0" y="12" font-family="Georgia, serif"
            font-size="30" text-anchor="middle" fill="#111">♣</text>
    </g>

  </g>
</svg>