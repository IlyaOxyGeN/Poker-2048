<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b3d1e">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">

    <title>Poker 2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>♠ Poker 2048 ♥</h1>
            <p class="subtitle">Соберите 👑 Роял-флеш</p>
        </header>

        <div class="hud">
            <div class="score-box">
                <div class="label">SCORE</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">BEST</div>
                <div class="value" id="best">0</div>
            </div>
            <button id="newGame">Новая</button>
        </div>

        <div class="board" id="board">
            <div class="grid-layer" id="gridLayer"></div>
            <div class="tiles-layer" id="tilesLayer"></div>
        </div>

        <p class="hint">Стрелки, WASD или свайпы</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
