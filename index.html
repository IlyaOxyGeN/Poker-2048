<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b3d1e">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    
    <title>Poker 2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>♠ Poker 2048 ♥</h1>
            <p class="subtitle">Соберите 👑 Роял-флеш</p>
        </header>

        <div class="hud">
            <div class="score-box">
                <div class="label">SCORE</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">BEST</div>
                <div class="value" id="best">0</div>
            </div>
            <button id="newGame">Новая</button>
            <button id="undoBtn" class="btn-info" title="Отменить ход" disabled>↩️</button>
            <button id="musicBtn" class="btn-info" title="Музыка">🔇</button>
            <button id="combosBtn" class="btn-info" title="Комбинации">📖</button>
        </div>

        <div class="board" id="board">
            <div class="grid-layer" id="gridLayer"></div>
            <div class="tiles-layer" id="tilesLayer"></div>
        </div>

        <p class="hint">Стрелки, WASD или свайпы</p>
    </div>

    <!-- ========================================== -->
    <!-- МОДАЛКА 1: СПРАВОЧНИК КОМБИНАЦИЙ (📖)      -->
    <!-- ========================================== -->
    <div class="modal" id="combosModal">
        <div class="modal-backdrop" id="combosBackdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="combosClose" aria-label="Закрыть">✕</button>
            <h2 class="modal-title">♠ Комбинации покера ♥</h2>
            <p class="modal-subtitle">Собирайте одинаковые — они сливаются в следующую</p>
            
            <div class="combos-list" id="combosList"></div>
            
            <div class="modal-hint">
                Цель — собрать 👑 <strong>Роял-флеш</strong> (1024 очка)
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- МОДАЛКА 2: ПОДТВЕРЖДЕНИЕ НОВОЙ ИГРЫ         -->
    <!-- ========================================== -->
    <div class="modal" id="confirmModal">
        <div class="modal-backdrop" id="confirmBackdrop"></div>
        <div class="modal-content confirm-content">
            <h2 class="modal-title">Начать заново?</h2>
            <p class="modal-subtitle">Текущий прогресс и счёт будут потеряны.</p>
            
            <div class="confirm-buttons">
                <button id="confirmYes" class="btn-yes">Да, заново</button>
                <button id="confirmNo" class="btn-no">Отмена</button>
            </div>
        </div>
    </div>

    <!-- АУДИО -->
    <audio id="bgMusic" loop preload="none">
        <source src="audio/bg-music.mp3" type="audio/mpeg">
    </audio>

    <!-- СКРИПТ -->
    <script src="script.js"></script>
</body>
</html>
